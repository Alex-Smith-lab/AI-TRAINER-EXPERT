<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>AI TRAINER EXPERT — Workspace</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<div id="workspaceApp"
     class="workspace mode-3d">

  <header class="workspace-bar">

    <div class="workspace-title">
      AI TRAINER <span>EXPERT</span>
      <span style="color:var(--muted);font-weight:500;">
        / Workspace
      </span>
    </div>

    <div id="workspaceTaskName"
         style="font-size:12px;color:var(--muted);">
      Loading task...
    </div>

    <div class="workspace-controls">

      <button id="toggleModeButton">
        Switch View
      </button>

      <button id="closeWorkspaceButton">
        Close
      </button>

      <button id="submitTaskButton"
              class="primary">
        Submit Task
      </button>

    </div>

  </header>

  <main class="workspace-body">

    <!-- 7 CAMERAS -->
    <aside class="camera-rail">

      <div style="
        font-size:10px;
        color:var(--muted);
        margin:5px 2px 10px;
        text-transform:uppercase;
        font-weight:900;">
        7 Cameras
      </div>

      <div id="cameraList"></div>

    </aside>

    <!-- CENTRAL VIEW -->
    <section class="lidar-stage">

      <div class="lidar-label">
        <strong id="stageTitle">
          3D LiDAR
        </strong>

        <span id="stageSubtitle">
          Draw a cuboid around an object
        </span>
      </div>

      <canvas id="lidarCanvas"></canvas>

      <div class="camera-view">
        <canvas id="cameraCanvas"></canvas>
      </div>

      <div class="workspace-footer">

        <button id="expandLidarButton">
          ⛶ Expand
        </button>

        <button id="resetViewButton">
          Reset
        </button>

      </div>

    </section>

    <!-- SIDE CONTROL PANEL -->
    <aside class="side-panel">

      <div class="side-section">

        <h3>Task</h3>

        <div class="metric-row">
          <span>Mode</span>
          <strong id="modeLabel">3D</strong>
        </div>

        <div class="metric-row">
          <span>Camera</span>
          <strong id="cameraLabel">Front Wide</strong>
        </div>

        <div class="metric-row">
          <span>Boxes</span>
          <strong id="boxCount">0</strong>
        </div>

      </div>

      <div class="side-section">

        <h3>Annotation</h3>

        <button id="drawCuboidButton"
                class="tool-btn">
          + Draw 3D Cuboid
        </button>

        <button id="generate2dButton"
                class="tool-btn">
          Generate Box to 2D
        </button>

        <button id="deleteSelectedButton"
                class="tool-btn">
          Delete Selected
        </button>

      </div>

      <div class="side-section">

        <h3>Selected Object</h3>

        <div class="field">
          <label>Class</label>

          <select id="classSelect">

            <option value="Car">Car</option>
            <option value="Truck">Truck</option>
            <option value="Bus">Bus</option>
            <option value="Motorcycle">Motorcycle</option>
            <option value="Bicycle">Bicycle</option>
            <option value="Pedestrian">Pedestrian</option>
            <option value="Unknown">Unknown</option>

          </select>
        </div>

        <div class="field">
          <label>Yaw / Heading</label>

          <input id="yawInput"
                 type="number"
                 value="0"
                 step="1">
        </div>

        <div class="locked-note">
          The heading arrow represents the front direction.
          Keep the cuboid aligned with the physical object.
        </div>

      </div>

      <div class="side-section">

        <h3>Production Metrics</h3>

        <div id="annotatorMetrics">
          Loading...
        </div>

      </div>

    </aside>

  </main>

</div>

<div id="workspaceToast"
     class="status-message hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="workspace.js"></script>

</body>
</html>
